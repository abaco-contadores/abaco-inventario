const tbl=r=>`<div class="sc"><table><tr>${r.cols.map((c,i)=>`<th ${'qmc'.includes(r.ty[i]||'x')?'style="text-align:right"':''}>${esc(c)}</th>`).join('')}</tr>${r.rows.map(x=>`<tr>${x.map((v,i)=>`<td ${'qmc'.includes(r.ty[i]||'x')?'style="text-align:right"':''}>${v===''?'':({q:fq,m:fm,c:fc}[r.ty[i]]?{q:fq,m:fm,c:fc}[r.ty[i]](v):esc(v))}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${r.cols.length}">Sin datos para estos filtros.</td></tr>`}${r.totals?`<tr>${r.totals.map((v,i)=>`<th ${'qmc'.includes(r.ty[i]||'x')?'style="text-align:right"':''}>${v===''?'':({q:fq,m:fm,c:fc}[r.ty[i]]?{q:fq,m:fm,c:fc}[r.ty[i]](v):esc(v))}</th>`).join('')}</tr>`:''}</table></div>`;
const xbar=()=>`<div class="acts"><button class="g s" onclick="doExp('x')">Excel (.xlsx)</button><button class="g s" onclick="doExp('p')">PDF</button><button class="g s" onclick="doExp('c')">CSV</button></div>`;
const inP=d=>{const [a,b]=rng();return d>=a&&d<=b},sum=(a,f)=>r2(a.reduce((s,x)=>s+Number(f(x)),0)),act=()=>D.prods.filter(p=>p.active&&(!S.cat||p.category_id==S.cat));
const R={stock:{n:'Inventario actual',cat:1,run:()=>({cols:['Código','Producto','Categoría','Unidad','Existencia','Mínimo','Alerta'],ty:['','','','','q','q',''],rows:act().map(p=>[p.code,p.name,p.category_name||'',p.unit_name,Number(p.stock),Number(p.min_stock),p.alert]),totals:null})},
 val:{n:'Valoración del inventario',cat:1,run:()=>{const l=act();return{cols:['Código','Producto','Unidad','Existencia','Costo promedio','Último costo','Precio ref.','Valor'],ty:['','','','q','c','c','c','m'],rows:l.map(p=>[p.code,p.name,p.unit_name,Number(p.stock),Number(p.avg_cost),p.last_cost==null?'':Number(p.last_cost),p.ref_price==null?'':Number(p.ref_price),Number(p.inv_value)]),totals:['','TOTAL','','','','','',sum(l,p=>p.inv_value)]}}},
 zero:{n:'Productos agotados',run:()=>({cols:['Código','Producto','Categoría','Unidad','Mínimo'],ty:['','','','','q'],rows:D.prods.filter(p=>p.active&&p.alert=='Agotado').map(p=>[p.code,p.name,p.category_name||'',p.unit_name,Number(p.min_stock)]),totals:null})},
 low:{n:'Productos con stock mínimo (Bajo o Medio)',run:()=>({cols:['Código','Producto','Unidad','Existencia','Mínimo','Faltante','Alerta'],ty:['','','','q','q','q',''],rows:D.prods.filter(p=>p.active&&(p.alert=='Bajo'||p.alert=='Medio')).map(p=>[p.code,p.name,p.unit_name,Number(p.stock),Number(p.min_stock),r2(p.min_stock-p.stock),p.alert]),totals:null})},
 buy:{n:'Compras por período',per:1,run:()=>{const l=D.pur.filter(p=>p.status=='confirmado'&&inP(p.invoice_date)).sort((a,b)=>a.invoice_date<b.invoice_date?-1:1);return{cols:['Fecha','Factura','Proveedor','RIF','Total'],ty:['','','','','m'],rows:l.map(p=>[dt(p.invoice_date),p.invoice_number,I.sup[p.supplier_id]?.name||'',I.sup[p.supplier_id]?.rif||'',Number(p.total)]),totals:['','','','TOTAL',sum(l,p=>p.total)]}}},
 bysup:{n:'Compras por proveedor',per:1,run:()=>{const m={};D.pur.filter(p=>p.status=='confirmado'&&inP(p.invoice_date)).forEach(p=>{const o=m[p.supplier_id]??={n:I.sup[p.supplier_id]?.name||'',r:I.sup[p.supplier_id]?.rif||'',c:0,t:0};o.c++;o.t+=Number(p.total)});const l=Object.values(m).sort((a,b)=>b.t-a.t);return{cols:['Proveedor','RIF','Facturas','Total'],ty:['','','','m'],rows:l.map(o=>[o.n,o.r,o.c,r2(o.t)]),totals:['TOTAL','',l.reduce((s,o)=>s+o.c,0),sum(l,o=>o.t)]}}},
 outp:{n:'Salidas por período',per:1,run:()=>{const l=D.mov.filter(m=>(m.kind=='entrega'||m.kind=='reversion_entrega')&&inP(m.occurred_on));return{cols:['Fecha','Documento','Producto','Cantidad','Costo unit.','Valor'],ty:['','','','q','c','m'],rows:l.map(m=>{const s=m.kind=='entrega'?1:-1;return[dt(m.occurred_on),m.doc_label+(s<0?' (anulación)':''),(I.prods[m.product_id]?.code||'')+' '+(I.prods[m.product_id]?.name||''),s*(m.kind=='entrega'?Number(m.qty_out):Number(m.qty_in)),Number(m.unit_cost),s*Number(m.value)]}),totals:null}}},
 notes:{n:'Notas de entrega',per:1,run:()=>{const l=D.del.filter(d=>d.status=='confirmado'&&inP(d.delivery_date)).sort((a,b)=>a.number-b.number);return{cols:['N°','Fecha','Destinatario','Recibe','Importe ref.'],ty:['','','','','m'],rows:l.map(d=>[String(d.number).padStart(6,'0'),dt(d.delivery_date),d.recipient_name,d.received_by||'',delTot(d)]),totals:['','','','TOTAL',sum(l,delTot)]}}},
 top:{n:'Productos de mayor movimiento',per:1,run:()=>{const m={};D.mov.filter(x=>inP(x.occurred_on)&&(x.kind=='compra'||x.kind=='entrega')).forEach(x=>{const o=m[x.product_id]??={e:0,s:0};o.e+=Number(x.qty_in);o.s+=Number(x.qty_out)});const l=Object.entries(m).map(([k,o])=>({p:I.prods[k],...o,t:o.e+o.s})).sort((a,b)=>b.t-a.t);return{cols:['Código','Producto','Unidad','Entradas','Salidas','Movimiento total'],ty:['','','','q','q','q'],rows:l.map(o=>[o.p.code,o.p.name,o.p.unit_name,r2(o.e),r2(o.s),r2(o.t)]),totals:null}}},
 evo:{n:'Evolución de existencias',prod:1,run:()=>{const p=I.prods[S.rp],mv=p?(I.mp[p.id]||[]):[];if(!mv.length)return{cols:['Mes','Existencia al cierre'],ty:['','q'],rows:[],totals:null};const rows=[];let k=mv[0].occurred_on.slice(0,7);const end=TODAY.slice(0,7);while(k<=end){const l=mv.filter(m=>m.occurred_on.slice(0,7)<=k).slice(-1)[0];rows.push([k.slice(5)+'/'+k.slice(0,4),l?Number(l.stock_after):0]);let [y,mm]=k.split('-').map(Number);mm++;if(mm>12){mm=1;y++}k=y+'-'+String(mm).padStart(2,'0')}return{cols:['Mes','Existencia al cierre ('+p.unit_name+')'],ty:['','q'],rows,totals:null}}},
 costh:{n:'Historial de costos',prod:1,per:1,run:()=>{const l=D.mov.filter(m=>(m.kind=='compra'||m.kind=='apertura')&&inP(m.occurred_on)&&(!S.rp||m.product_id==S.rp));return{cols:['Fecha','Documento','Producto','Cantidad (base)','Costo unit. (base)','Costo promedio resultante'],ty:['','','','q','c','c'],rows:l.map(m=>[dt(m.occurred_on),m.doc_label||'',(I.prods[m.product_id]?.code||'')+' '+(I.prods[m.product_id]?.name||''),Number(m.qty_in),Number(m.unit_cost),Number(m.avg_cost_after)]),totals:null}}}};
const repRun=()=>{const d=R[S.rep],r=d.run(),sub=[d.per?perL():'Al '+dt(TODAY),d.cat&&S.cat?'Categoría: '+(I.cats[S.cat]?.name||''):'',d.prod&&S.rp?'Producto: '+I.prods[S.rp].code:''].filter(Boolean).join(' · ');return{title:d.n,sub,...r}};
const curRep=()=>S.sub=='kar'?repKar():repRun();
function reps(){return`<h1>Reportes</h1>${Object.entries(R).map(([k,d])=>`<div class="card click" onclick="S.rep='${k}';go('more','rep')"><b class="gold">${d.n}</b></div>`).join('')}<div class="card click" onclick="go('more','kar')"><b class="gold">Kardex</b><div class="k">Por producto, con filtros y exportación</div></div>`}
function repView(){const d=R[S.rep];return`<h1>${d.n}</h1>${d.per?fbar():''}${d.cat?`<select onchange="S.cat=this.value;render()"><option value="">Todas las categorías</option>${D.cats.map(c=>`<option value="${c.id}" ${S.cat==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`:''}${d.prod?`<button class="g" style="width:100%;text-align:left;margin:8px 0" onclick="chooseProd(x=>{S.rp=x.id;render()})">${S.rp?esc(I.prods[S.rp].code+' · '+I.prods[S.rp].name):'Elegir producto'+(S.rep=='costh'?' (opcional)':'…')}</button>`:''}${(d.prod&&S.rep=='evo'&&!S.rp)?'<div class="card k">Elige un producto.</div>':tbl(repRun())+xbar()}`}
const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').toLowerCase().slice(0,40);
function loadX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const e=document.createElement('script');e.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';e.onload=ok;e.onerror=()=>no(new Error('No se pudo cargar el generador de Excel. Revisa tu conexión.'));document.head.append(e)})}
async function doExp(t){if(S.sub=='kar'&&!S.kp){alert('Elige un producto.');return}if(S.sub=='rep'&&S.rep=='evo'&&!S.rp){alert('Elige un producto.');return}
 const r=curRep(),name='abaco-'+slug(r.title)+'-'+TODAY;
 if(t=='x'){try{await loadX()}catch(e){alert(e.message);return}const rows=[[r.title],[r.sub],['Generado el '+dt(TODAY)],[],r.cols,...r.rows,...(r.totals?[r.totals]:[])],ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();
  ws['!cols']=r.cols.map((_,i)=>({wch:Math.min(46,Math.max(11,...r.rows.map(x=>String(x[i]??'').length)))}));XLSX.utils.book_append_sheet(wb,ws,'Reporte');XLSX.writeFile(wb,name+'.xlsx')}
 else if(t=='c'){const cell=v=>{v=typeof v=='number'?String(v).replace('.',','):String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const csv='\ufeff'+[r.cols,...r.rows,...(r.totals?[r.totals]:[])].map(x=>x.map(cell).join(';')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name+'.csv';a.click()}
 else printHtml(r.title,r.sub,tbl(r))}
function printHtml(t,sub,body){const d=document.createElement('div');d.id='st';d.innerHTML=`<div class="np acts"><button class="b" onclick="print()">Imprimir / guardar PDF</button><button class="g" onclick="this.closest('#st').remove()" style="color:#000">Cerrar</button></div><h3 style="color:#C2A97F;margin-top:12px">Ábaco Inventario</h3><h1>${esc(t)}</h1><p>${esc(sub||'')}</p>${body}<p style="margin-top:22px;font-size:12px;color:#666">Generado el ${dt(TODAY)} · Ábaco Inventario</p>`;document.body.append(d)}
const lineTbl=(ls,del)=>`<div class="sc"><table><tr><th>Código</th><th>Descripción</th><th>Cant.</th><th>Unidad</th>${del?'<th>Costo ref.</th>':'<th>Costo</th><th>Desc.%</th>'}<th>Importe</th></tr>${ls.map(l=>`<tr><td>${esc(I.prods[l.product_id]?.code)}</td><td>${esc(I.prods[l.product_id]?.name)}</td><td>${fq(l.qty)}</td><td>${esc(D.units.find(u=>u.id==l.unit_id)?.name)}</td>${del?`<td>${fc(l.unit_cost)}</td><td>${fm(l.line_value)}</td>`:`<td>${fc(l.unit_cost)}</td><td>${fq(l.discount_pct)}</td><td>${fm(l.line_total)}</td>`}</tr>`).join('')}</table></div>`;
function printPur(id){const p=I.pur[id],s=I.sup[p.supplier_id];printHtml('Factura de compra N° '+p.invoice_number,'Estado: '+p.status,`<p><b>Proveedor:</b> ${esc(s?.name)} · RIF ${esc(s?.rif||'—')}<br><b>Fecha:</b> ${dt(p.invoice_date)}${p.control_number?' · <b>Control:</b> '+esc(p.control_number):''}<br>${esc(p.notes||'')}</p>${lineTbl(I.pl[id]||[],false)}<h3 style="margin-top:14px">Total: ${fm(purTot(p))}</h3>`)}
function printDel(id){const d=I.del[id];printHtml('Nota de entrega '+(d.number?'N° '+String(d.number).padStart(6,'0'):'(borrador)'),'Estado: '+d.status,`<p style="font-weight:700;color:#000">DOCUMENTO INTERNO DE ENTREGA.<br>NO CONSTITUYE FACTURA FISCAL NI COMPROBANTE TRIBUTARIO.</p><p><b>Destinatario:</b> ${esc(d.recipient_name)} ${esc(d.recipient_doc||'')}<br><b>Dirección:</b> ${esc(d.address||'—')}<br><b>Fecha:</b> ${dt(d.delivery_date)} · <b>Recibe:</b> ${esc(d.received_by||'—')}<br>${esc(d.notes||'')}</p>${lineTbl(I.dl[id]||[],true)}<h3 style="margin-top:14px">Importe de referencia: ${d.status=='borrador'?'—':fm(delTot(d))}</h3><p style="margin-top:50px">_______________________ Entregado por &nbsp;&nbsp;&nbsp;&nbsp; _______________________ Recibido por</p>`)}
// ---- sesión
function loginView(msg){$nav.innerHTML='';$m.innerHTML=`<div class="ctr" style="margin:6px 0 14px"><img src="icon-192.png" alt="Ábaco Inventario" style="width:96px;height:96px;border-radius:22px"></div><h1 class="ctr">Ábaco Inventario</h1><p class="k ctr">Inicia sesión para ver tu inventario en cualquier dispositivo.</p><div class="card"><label>Correo<input id="em" type="email" autocomplete="email"></label><label>Contraseña<input id="pw" type="password" autocomplete="current-password"></label><p class="bad" id="lm">${msg||''}</p><div class="acts"><button class="b" onclick="auth('in')">Entrar</button><button class="g" onclick="auth('up')">Crear cuenta</button></div></div>`}
async function auth(m){const email=g('em').value.trim(),password=g('pw').value;g('lm').textContent='Un momento…';const r=m=='in'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
 if(r.error){g('lm').textContent=r.error.message;return}if(!r.data.session){g('lm').textContent='Revisa tu correo para confirmar la cuenta y luego pulsa Entrar.';return}me=r.data.session.user;await start()}
async function start(){$m.innerHTML='<p class="k">Cargando…</p>';const s=await sb.rpc('inv_seed');if(s.error)alert(s.error.message);if(await load())render()}
async function logout(){await sb.auth.signOut();me=null;D={};loginView()}
sb.auth.getSession().then(({data})=>{if(data.session){me=data.session.user;start()}else loginView()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me)load().then(ok=>ok&&!document.querySelector('dialog[open]')&&render())});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
